# ===========================================================================
# Docker Compose — Local CI/CD Infrastructure
# ===========================================================================
# Spins up Jenkins, SonarQube, and PostgreSQL (for SonarQube) locally.
# Usage:
#   docker-compose up -d
#   Access Jenkins   → http://localhost:8080
#   Access SonarQube → http://localhost:9000
# ===========================================================================

services:

  # ── Jenkins CI/CD Server ──
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"       # Jenkins Web UI
      - "50000:50000"     # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Allow Jenkins to use Docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false   # Skip setup wizard (for automation)
    networks:
      - cicd-network

  # ── SonarQube Code Quality Server ──
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"       # SonarQube Web UI
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar_password
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    networks:
      - cicd-network

  # ── PostgreSQL for SonarQube ──
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonarqube
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_password
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - cicd-network

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  cicd-network:
    driver: bridge

