# ===========================================================================
# sonar-project.properties - SonarQube Configuration
# ===========================================================================
# This file is used when running SonarScanner CLI standalone.
# When using `mvn sonar:sonar`, the pom.xml properties take precedence.
# ===========================================================================

sonar.projectKey=org.example:untitled
sonar.projectName=untitled
sonar.projectVersion=1.0-SNAPSHOT

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Language
sonar.language=java
sonar.sourceEncoding=UTF-8

# Coverage reports (generated by JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (files to skip in analysis)
sonar.exclusions=**/generated-sources/**

# SonarQube server URL and authentication
# sonar.host.url=http://localhost:9000
sonar.token=sqa_85cb67cc9aa163cc233bc0b53d1903e73419650f

